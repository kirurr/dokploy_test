services:
  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bananas
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bananas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bananas"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
